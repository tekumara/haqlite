[package]
name = "haqlite-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]
members = ["."]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.haqlite]
path = ".."

[dependencies.hrana-server]
git = "https://github.com/russellromney/hrana-server.git"
version = "0.1.0"
rev = "a3e554aedd6313175a367485bd2718a0e74ff1cc"

# Match the root workspace: patches are not inherited by standalone fuzz builds.
[patch.crates-io]
hadb-storage = { git = "https://github.com/tekumara/hadb.git", rev = "04ae183df58186672379206ba5f2f56c10b168df" }
hadb-io = { git = "https://github.com/tekumara/hadb.git", rev = "04ae183df58186672379206ba5f2f56c10b168df" }
hadb-changeset = { git = "https://github.com/tekumara/hadb.git", rev = "04ae183df58186672379206ba5f2f56c10b168df" }

[dependencies.serde_json]
version = "1"

[[bin]]
name = "sql_forwarding"
path = "fuzz_targets/sql_forwarding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hrana_protocol"
path = "fuzz_targets/hrana_protocol.rs"
test = false
doc = false
bench = false
