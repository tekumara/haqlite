[workspace]
members = [".", "haqlite-turbolite"]
resolver = "2"

[workspace.dependencies]
hadb = { git = "https://github.com/russellromney/hadb.git", rev = "3142b3d6062a7aa5a8a1cb211ee38b647fe0f48b", version = "0.5.0" }
hadb-cli = { git = "https://github.com/russellromney/hadb.git", rev = "3142b3d6062a7aa5a8a1cb211ee38b647fe0f48b", version = "0.5.0" }
hadb-lease = { git = "https://github.com/russellromney/hadb.git", rev = "3142b3d6062a7aa5a8a1cb211ee38b647fe0f48b", version = "0.5.0" }
hadb-lease-cinch = { git = "https://github.com/russellromney/hadb.git", rev = "3142b3d6062a7aa5a8a1cb211ee38b647fe0f48b", version = "0.5.0" }
hadb-lease-nats = { git = "https://github.com/russellromney/hadb.git", rev = "3142b3d6062a7aa5a8a1cb211ee38b647fe0f48b", version = "0.5.0" }
hadb-lease-s3 = { git = "https://github.com/russellromney/hadb.git", rev = "3142b3d6062a7aa5a8a1cb211ee38b647fe0f48b", version = "0.5.0" }
hadb-storage = { git = "https://github.com/russellromney/hadb.git", rev = "3142b3d6062a7aa5a8a1cb211ee38b647fe0f48b", version = "0.5.0" }
hadb-storage-cinch = { git = "https://github.com/russellromney/hadb.git", rev = "3142b3d6062a7aa5a8a1cb211ee38b647fe0f48b", version = "0.5.0" }
hadb-storage-local = { git = "https://github.com/russellromney/hadb.git", rev = "3142b3d6062a7aa5a8a1cb211ee38b647fe0f48b", version = "0.5.0" }
hadb-storage-s3 = { git = "https://github.com/russellromney/hadb.git", rev = "3142b3d6062a7aa5a8a1cb211ee38b647fe0f48b", version = "0.5.0" }
turbodb = { git = "https://github.com/russellromney/hadb.git", rev = "3142b3d6062a7aa5a8a1cb211ee38b647fe0f48b", version = "0.5.0" }
turbodb-manifest-cinch = { git = "https://github.com/russellromney/hadb.git", rev = "3142b3d6062a7aa5a8a1cb211ee38b647fe0f48b", version = "0.5.0" }
turbodb-manifest-mem = { git = "https://github.com/russellromney/hadb.git", rev = "3142b3d6062a7aa5a8a1cb211ee38b647fe0f48b", version = "0.5.0" }
walrust = { git = "https://github.com/russellromney/walrust.git", rev = "1c0656e2ce896a38fdf064a27402f6a8deb1f5aa", version = "0.7.0", package = "walrust-core" }
turbolite = { git = "https://github.com/russellromney/turbolite.git", rev = "6a4f60741bbfd4243331bd837227fb264bdaa349", version = "0.5.0", features = ["zstd"] }

# walrust-core uses published hadb 0.5 crates. Unify their trait identities
# with our main-pinned hadb crates; Turbolite's 0.4 requirements stay separate.
[patch.crates-io]
hadb-storage = { git = "https://github.com/russellromney/hadb.git", rev = "3142b3d6062a7aa5a8a1cb211ee38b647fe0f48b" }
hadb-io = { git = "https://github.com/russellromney/hadb.git", rev = "3142b3d6062a7aa5a8a1cb211ee38b647fe0f48b" }
hadb-changeset = { git = "https://github.com/russellromney/hadb.git", rev = "3142b3d6062a7aa5a8a1cb211ee38b647fe0f48b" }

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Russell Romney <russellromney@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/russellromney/haqlite"

[package]
name = "haqlite"
version = "0.4.0"
edition = "2021"
description = "HA SQLite with one line of code. Leader election, WAL replication, write forwarding — just your app + an S3 bucket."
authors = ["Russell Romney <russellromney@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/russellromney/haqlite"
keywords = ["sqlite", "ha", "replication", "leader-election", "s3"]
categories = ["database", "network-programming"]

[dependencies]
# HA coordination framework
hadb = { workspace = true }
hadb-lease-s3 = { workspace = true }

# WAL sync primitives
walrust = { workspace = true }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# S3 (for S3LeaseStore)
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-smithy-types = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# Utilities
tempfile = "3"
anyhow = "1"
arc-swap = "1"
parking_lot = "0.12"
tracing = "0.1"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"

# HTTP (write forwarding + experiment binaries)
axum = "0.8"
reqwest = { version = "0.12", features = ["json"] }

# NATS lease store (optional)
hadb-lease-nats = { workspace = true, optional = true }

# Lease abstractions (trait crate provides FenceSource used by fenced
# storage adapters).
hadb-lease = { workspace = true }

# Storage substrate (trait + impls)
hadb-storage = { workspace = true }
hadb-storage-s3 = { workspace = true }
hadb-storage-cinch = { workspace = true }

# HTTP lease store
hadb-lease-cinch = { workspace = true }

# Shared CLI framework
hadb-cli = { workspace = true }

# Hrana protocol (libSQL HTTP API)
hrana-server = { git = "https://github.com/russellromney/hrana-server.git", rev = "a3e554aedd6313175a367485bd2718a0e74ff1cc", version = "0.1.0", package = "hrana-server" }

# CLI + logging
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SQLite
rusqlite = { version = "0.35", features = ["bundled", "backup"] }

[features]
nats-lease = ["dep:hadb-lease-nats"]

[[bin]]
name = "haqlite"
path = "src/bin/main.rs"

[[bin]]
name = "haqlite-ha-experiment"
path = "src/bin/ha_experiment.rs"

[[bin]]
name = "haqlite-ha-writer"
path = "src/bin/ha_writer.rs"

[[bin]]
name = "haqlite-e2e"
path = "src/bin/e2e.rs"

[[bin]]
name = "haqlite-shared-experiment"
path = "src/bin/shared_experiment.rs"

[[bin]]
name = "haqlite-experiment"
path = "src/bin/experiment.rs"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.35", features = ["bundled"] }
async-trait = "0.1"
async-nats = "0.46"
futures = "0.3"
chrono = "0.4"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
axum = "0.8"
proptest = "1.5"
proptest-derive = "0.5"
hadb-storage-local = { workspace = true }
