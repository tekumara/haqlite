[package]
name = "haqlite-turbolite"
version = "0.4.0"
edition = "2021"
description = "Tiered HA SQLite: haqlite + turbolite VFS for page-level S3 tiering"
authors = ["Russell Romney <russellromney@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/russellromney/haqlite"
keywords = ["sqlite", "ha", "tiered-storage", "vfs", "s3"]
categories = ["database", "network-programming"]

[dependencies]
# Base haqlite (walrust HA layer) — workspace root.
haqlite = { path = "..", version = "0.4.0" }

# HA coordination
hadb = { workspace = true }
hadb-lease = { workspace = true }

# Turbolite main still uses the 0.4 storage trait; adapt only at its VFS boundary.
hadb-storage-04 = { package = "hadb-storage", version = "=0.4.1" }

# Storage substrate
turbodb = { workspace = true }
turbodb-manifest-cinch = { workspace = true }

# Turbolite VFS
turbolite = { workspace = true }

# WAL sync (walrust is always present for Continuous/Checkpoint paths)
walrust = { workspace = true }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
async-trait = "0.1"

# Utilities
tempfile = "3"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# Serialization
rmp-serde = "1"

# HTTP (for rollback_detection fetch)
reqwest = { version = "0.12", features = ["json"] }

# HTTP lease store (for builder convenience)
hadb-lease-cinch = { workspace = true }

# S3 storage backend (optional, for direct S3 use)
hadb-storage = { workspace = true }
hadb-storage-s3 = { workspace = true, optional = true }
hadb-storage-cinch = { workspace = true }

# SQLite
rusqlite = { version = "0.35", features = ["bundled"] }

[features]
default = ["s3"]
s3 = ["dep:hadb-storage-s3"]
legacy-s3-mode-tests = ["s3"]

[[bin]]
name = "haqlite-turbolite-bench"
path = "src/bin/tiered_bench.rs"
required-features = ["s3"]

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turbodb-manifest-mem = { workspace = true }
hadb-storage-local = { workspace = true }
proptest = "1"
